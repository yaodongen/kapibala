appId: com.kapibala.app
productName: Kapibala
copyright: Kapibala

afterSign: build/after-sign.cjs

directories:
  output: release
  buildResources: build

# 主进程/preload/渲染进程都已被 esbuild 打成单文件，所以只需要这两样，
# 不需要 node_modules（也就绕过了 pnpm 符号链接和 electron-builder 的老问题）
files:
  - dist/**
  - package.json

mac:
  category: public.app-category.productivity
  icon: ../../ui/Kapibala.icns
  target:
    - target: dir
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
  # 两个架构各出一个 dmg，名字里必须带 arch，否则 x64 那份默认不带后缀、认不出来
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # 读 iCloud 云盘里的库时，macOS 会弹权限确认。这几句是弹窗里显示的理由，
    # 不写就用系统的默认文案。权限本身躲不掉，只能说清楚为什么要。
    NSFileProviderDomainUsageDescription: >-
      Kapibala 需要读写你选定的库文件夹。库放在 iCloud 云盘里时，多台 Mac 才能自动同步。
      所有数据只留在这个文件夹和本机，不会上传到任何第三方服务器。
    NSDocumentsFolderUsageDescription: >-
      Kapibala 需要读写你选定的库文件夹。如果库建在“文稿”里，就需要这项权限。
    NSDownloadsFolderUsageDescription: >-
      Kapibala 只在你把库建在“下载”文件夹时才需要这项权限。
    NSRemovableVolumesUsageDescription: >-
      Kapibala 只在你把库放在外置硬盘上时才需要这项权限。
  # "-" = ad-hoc 签名。不能用 null（那是完全跳过签名，改完 bundle 后封装是坏的，
  # 下载下来会被 Gatekeeper 报"已损坏"）。分发给别人仍需真证书 + 公证。
  identity: "-"

dmg:
  title: Kapibala ${version}
  # 一眼能看出是安装包：app 图标 + 装入角标。挂载后桌面上那个卷用的也是它
  icon: ../../ui/dmg.icns
  background: build/background.tiff
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - x: 148
      y: 190
      type: file
    - x: 408
      y: 190
      type: link
      path: /Applications
