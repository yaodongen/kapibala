<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>Kapibala</title>
<style>
:root{
  --bg:#ffffff; --sidebar:#f5f5f7; --border:#e3e3e6; --text:#1d1d1f;
  --dim:#86868b; --accent:#8b6f47; --accent-soft:#f0e9df; --danger:#d93025;
  --row-hover:#f7f7f8; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1e1e20; --sidebar:#252528; --border:#35353a; --text:#f2f2f4;
    --dim:#8e8e93; --accent:#c8a273; --accent-soft:#33302b; --danger:#ff6b5e;
    --row-hover:#2a2a2e; --shadow:0 1px 3px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
/* hidden 属性自带的 display:none 来自 UA 样式，优先级最低 —— 下面任何
   display:flex 都会把它压掉。覆盖层就会从启动起一直显示、还关不掉。 */
[hidden]{ display:none !important }
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  color:var(--text); background:var(--bg); height:100vh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid; grid-template-columns:216px 1fr 340px; height:100vh}   /* 备注栏常驻 */

/* ── 侧边栏 ── */
.sidebar{
  background:var(--sidebar); border-right:1px solid var(--border);
  padding:14px 8px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:8px; padding:4px 8px 12px; user-select:none}
.brand span{font-weight:600; font-size:14px; letter-spacing:.01em}
.nav{
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
  cursor:default; color:var(--text); font-size:13.5px; border:none; background:none;
  width:100%; text-align:left; font-family:inherit;
}
.nav:hover{background:var(--row-hover)}
.nav.on{background:var(--accent-soft); font-weight:500}
.nav .ico{width:16px; text-align:center; opacity:.75; flex:none}
.nav .n{margin-left:auto; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}
.sep{height:1px; background:var(--border); margin:8px 8px}

/* ── 主区 ── */
.main{display:flex; flex-direction:column; overflow:hidden}
header{padding:20px 28px 12px}
#search{ width:100%; margin:0 0 8px; padding:6px 9px; font:inherit; font-size:12.5px;
         border:1px solid var(--border); border-radius:7px; background:var(--bg);
         color:var(--text); -webkit-appearance:none }
#search:focus{ outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent }
h1{font-size:22px; font-weight:600; letter-spacing:-.01em}
.vhead{display:flex; align-items:flex-start; gap:12px}
.vheadtext{flex:1; min-width:0}
.ghost{ font:inherit; font-size:12.5px; padding:5px 11px; border-radius:7px; flex:none;
        border:1px solid var(--border); background:var(--bg); color:var(--dim); cursor:default }
.ghost:hover{ border-color:var(--danger); color:var(--danger) }
.sub{color:var(--dim); font-size:12.5px; margin-top:2px}
.add{padding:4px 28px 12px; display:flex; gap:8px; flex-wrap:wrap}   /* 详情栏挤窄时要能换行 */
.add input[type=text]{
  flex:1 1 140px; min-width:0; padding:8px 11px; border:1px solid var(--border); border-radius:7px;
  background:var(--bg); color:var(--text); font:inherit; font-size:13.5px;
}
.add input[type=text]:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.add input[type=date],.add select{
  padding:8px; border:1px solid var(--border); border-radius:7px;
  background:var(--bg); color:var(--dim); font:inherit; font-size:12.5px;
}
/* 原生 select 会自己撑到最长那条选项的宽度（英文里是 "Monthly on the last
   Wednesday"），能把整条添加栏顶到换行。给个上限，让它自己截断 */
.add select{ max-width:170px }
.dmeta select{ max-width:100% }
/* 「每 [17] 天」：跟在重复下拉后面，只有选了"自定义天数…"才出现 */
.customdays{ display:inline-flex; align-items:center; gap:4px; color:var(--dim); white-space:nowrap }
.customdays input{ width:54px; font:inherit; padding:3px 6px; border:1px solid var(--border);
                   border-radius:6px; background:var(--bg); color:var(--text) }
.customdays input:focus{ outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent }
.add .customdays{ font-size:12.5px }
.add .customdays input{ padding:7px 8px; font-size:12.5px }
.dmeta .customdays{ font-size:11.5px }
.dmeta .customdays input{ font-size:11.5px }
.list{flex:1; overflow-y:auto; padding:0 28px 40px}

/* ── 分组 ── */
.group{margin-top:18px}
.ghead{
  display:flex; align-items:baseline; gap:7px; padding:0 2px 6px;
  font-size:12px; font-weight:600; color:var(--dim); letter-spacing:.02em;
}
.ghead .wd{font-weight:400}
.ghead.overdue{color:var(--danger)}

/* ── 任务行 ── */
.task{
  display:flex; align-items:flex-start; gap:10px; padding:7px 8px;
  border-radius:7px; margin:0 -8px;
}
.task:hover{background:var(--row-hover)}
/* 勾完先停一下再消失：前段维持原样（看清勾上了），后段淡出。
   时长由 app.ts 的 LINGER 写进 --linger，两边不会各走各的 */
.task.leaving{ animation:taskleave var(--linger, 450ms) ease-in forwards }   /* 淡出期间仍可点，点一下就退回未完成 */
@keyframes taskleave{ 0%,35%{ opacity:1 } 100%{ opacity:0 } }
@media (prefers-reduced-motion:reduce){ .task.leaving{ animation:none; opacity:.5 } }
.box{
  flex:none; width:17px; height:17px; margin-top:1px; border-radius:50%;
  border:1.5px solid var(--dim); background:none; cursor:default; position:relative;
}
/* 看着是 17px，能点的范围往外再扩 5px —— 一行只有一个圆圈，不怕误触 */
.box::before{ content:""; position:absolute; inset:-5px }
/* 悬浮时要一眼看出"这里能点"：描边变色 + 填色 + 往外一圈光晕 */
.box:hover{ border-color:var(--accent); background:var(--accent-soft);
            box-shadow:0 0 0 4px var(--accent-soft) }
.box.done{background:var(--accent); border-color:var(--accent)}
.box.done:hover{ background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft) }
.box.done::after{
  content:""; position:absolute; left:5px; top:2.5px; width:4.25px; height:8.5px;
  border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(40deg);
}
.body{flex:1; min-width:0}
.title{font-size:13.5px; word-break:break-word}
/* 就地编辑：跟标题长得一样，只是能打字 */
.titleedit{ font:inherit; font-size:13.5px; width:100%; padding:0; margin:0; border:none;
            outline:none; background:none; color:var(--text);
            -webkit-user-select:text; user-select:text }
.task.is-done .title{color:var(--dim); text-decoration:line-through}
/* 时间贴在整行末尾，跟标题同一行 */
.when{ flex:none; margin-left:8px; margin-top:1px; font-size:11.5px; color:var(--dim);
       font-variant-numeric:tabular-nums; white-space:nowrap }
.tag{
  display:inline-flex; align-items:center; gap:3px; padding:0 5px;
  border-radius:4px; background:var(--accent-soft); color:var(--accent);
  font-size:11px; font-weight:500;
}
/* 重复标签贴在整行最右边，和时间一起构成右侧那一列 */
.tag.rep{ flex:none; margin-left:8px; margin-top:1px; white-space:nowrap }

/* ── 右侧详情栏 ── */
.detailpane{ border-left:1px solid var(--border); display:flex; flex-direction:column;
             overflow:hidden; background:var(--bg); padding-top:34px; position:relative }
.dhead{ display:flex; align-items:flex-start; gap:8px; padding:8px 16px 10px }
/* 标题就地可编辑：外观仍是标题，不做成一眼就是输入框的样子 */
.dhead .t{ font-size:14.5px; font-weight:600; line-height:1.4; width:100%; padding:0; margin:0;
           border:none; outline:none; background:none; color:var(--text); font-family:inherit;
           -webkit-user-select:text; user-select:text }
.dhead .t:hover{ background:var(--row-hover); border-radius:5px }
.dhead .t:focus{ background:var(--row-hover); border-radius:5px }
.dmeta{ padding:0 16px 10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
        font-size:11.5px; color:var(--dim) }
.dmeta input{ font:inherit; font-size:11.5px; padding:3px 6px; border:1px solid var(--border);
              border-radius:6px; background:var(--bg); color:var(--text) }
.dmeta input:hover{ border-color:var(--dim) }
/* 时间框和它的叉号是一体的：叉号只在有具体时间时才存在 */
.dmeta .dtimebox{ display:inline-flex; align-items:center; gap:1px }
.dmeta .dclear{ font:inherit; font-size:10px; line-height:1; width:18px; height:18px; padding:0;
                display:flex; align-items:center; justify-content:center; border:none;
                border-radius:50%; background:none; color:var(--dim); opacity:.5; cursor:default }
.dmeta .dclear:hover{ opacity:1; background:var(--danger); color:#fff }
.dlabel{ padding:0 16px 6px; font-size:11px; color:var(--dim); letter-spacing:.02em }
.dbody{ padding:0 16px 22px; overflow-y:auto; flex:1; display:flex; flex-direction:column }
.dempty{ padding:0 16px; color:var(--dim); font-size:12.5px; line-height:1.6 }
.task.sel{ background:var(--row-hover) }

/* ── 备注 ── */
.md{ font-size:13px; line-height:1.65; color:var(--text); flex:1;
     -webkit-user-select:text; user-select:text; cursor:text }
.md:empty::before{ content:var(--md-empty, ''); color:var(--dim) }
.md > :first-child{ margin-top:0 }
.md > :last-child{ margin-bottom:0 }
.md p{ margin:.35em 0 }
.md h3, .md h4, .md h5, .md h6{ font-size:12.5px; font-weight:600; margin:.7em 0 .3em }
.md ul, .md ol{ margin:.35em 0; padding-left:1.3em }
.md li{ margin:.15em 0 }
.md code{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
          background:var(--row-hover); padding:1px 4px; border-radius:4px }
.md pre{ background:var(--row-hover); padding:8px 10px; border-radius:7px; overflow-x:auto; margin:.45em 0 }
.md pre code{ background:none; padding:0 }
.md blockquote{ margin:.4em 0; padding-left:9px; border-left:2px solid var(--border); color:var(--dim) }
.md hr{ border:none; border-top:1px solid var(--border); margin:.7em 0 }
.md a{ color:var(--accent) }
.md del{ color:var(--dim) }
.noteedit{ width:100%; flex:1; resize:none; padding:0; margin:0; border:none; outline:none;
           background:none; color:var(--text); font:inherit; font-size:13px; line-height:1.65;
           -webkit-user-select:text; user-select:text }
.notehint{ position:absolute; right:16px; bottom:6px; font-size:11px; color:var(--dim);
            background:var(--bg); padding-left:8px; pointer-events:none }
.notefirst{ font-size:11.5px; color:var(--dim); margin-top:2px; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap }
.empty{padding:56px 0; text-align:center; color:var(--dim); font-size:13px}
.empty .big{font-size:34px; display:block; margin-bottom:10px; opacity:.5}

/* 桌面版新增 */
.app{ -webkit-user-select:none; user-select:none }
.sidebar{ padding-top:34px }            /* 让出 hiddenInset 标题栏 */
.vault{ margin:0 0 8px; padding:6px 9px; font-size:12px; color:var(--text); line-height:1.4;
        border:1px solid var(--border); background:transparent; text-align:left; width:100%;
        font-family:inherit; border-radius:7px; cursor:default;
        display:flex; align-items:center; gap:6px }
.vault:hover{ border-color:var(--dim) }
.vault b{ color:var(--text); font-weight:600 }
.vault .swap{ margin-left:auto; opacity:.55; font-size:11px }
.sidefoot{ margin-top:auto; padding:8px 8px 2px; display:flex; align-items:baseline; gap:8px }
.sidefoot #langbtn{ margin-left:auto }
/* 库列表 */
.vlist{ margin:0; padding:6px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:2px }
.vrow{ display:flex; align-items:flex-start; gap:9px; padding:8px 10px; border-radius:8px;
       border:none; background:none; font:inherit; text-align:left; width:100%; cursor:default;
       color:var(--text) }
.vrow:hover{ background:var(--row-hover) }
.vrow .dot{ flex:none; width:14px; text-align:center; color:var(--accent); margin-top:1px }
.vrow .nm{ font-size:13px }
.vrow .pt{ display:block; font-size:11px; color:var(--dim); margin-top:2px; word-break:break-all }
.vrow.off .nm, .vrow.off .pt{ color:var(--dim) }
.vrow .miss{ margin-left:auto; flex:none; font-size:11px; color:var(--danger) }
/* 圆形的关闭按钮。行本身是 button，所以这里只能用 span，不能嵌套 button */
.vrow .forget{ margin-left:auto; flex:none; width:19px; height:19px; margin-top:1px;
               display:flex; align-items:center; justify-content:center; border-radius:50%;
               font-size:12px; line-height:1; color:var(--dim); opacity:.45; cursor:default }
.vrow:hover .forget{ opacity:1 }
.vrow .forget:hover{ background:var(--danger); color:#fff }
.vrow .miss + .forget{ margin-left:8px }
.sheet-foot .note{ font-size:11px; color:var(--dim); align-self:center; margin-left:4px }
.banner{ margin:0 28px 8px; padding:7px 10px; border-radius:7px; font-size:12px;
         background:var(--accent-soft); color:var(--accent) }
.banner.warn{ background:#fdeceb; color:var(--danger) }
@media (prefers-color-scheme:dark){ .banner.warn{ background:#3a2422 } }
.title, .add input{ -webkit-user-select:text; user-select:text }
/* 藏了标题栏就必须自己给一条可拖动区域，否则窗口拖不动 */
/* 引导页 */
.welcome{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          background:var(--bg); z-index:20; padding:40px 28px }
.welcome-box{ max-width:460px; text-align:center }
.welcome h2{ font-size:22px; font-weight:600; margin:16px 0 22px; letter-spacing:-.01em }
.welcome .lede{ color:var(--dim); font-size:13.5px; line-height:1.6; margin-bottom:24px }
.welcome ul{ list-style:none; text-align:left; margin:0 auto 26px; max-width:400px;
             display:flex; flex-direction:column; gap:12px }
.welcome li{ display:flex; gap:10px; font-size:13px; line-height:1.5 }
.welcome li b{ font-weight:600 }
.welcome li .ic{ flex:none; width:20px; text-align:center; opacity:.7 }
.welcome #pick{ font:inherit; font-size:14px; font-weight:500; padding:9px 22px;
                 border:none; border-radius:8px; background:var(--accent); color:#fff;
                 cursor:default; box-shadow:var(--shadow) }
.welcome #pick:hover{ filter:brightness(1.08) }
.welcome .hint{ margin-top:14px; font-size:11.5px; color:var(--dim); line-height:1.6 }
/* 日志面板 */
.logbtn{ border:none; background:none; font:inherit; font-size:11px; color:var(--dim);
         padding:2px 0; cursor:default; text-decoration:underline; text-underline-offset:2px }
.logbtn:hover{ color:var(--text) }
.sheet{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.28);
        display:flex; align-items:center; justify-content:center; padding:34px 24px 24px }
.sheet-box{ background:var(--bg); border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.28);
            width:100%; max-width:760px; max-height:100%; display:flex; flex-direction:column }
.sheet-head{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border) }
.sheet-head b{ font-size:13.5px; white-space:nowrap }
.sheet-head .path{ color:var(--dim); font-size:11px; margin-left:auto; user-select:text;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; max-width:60% }
.sheet pre{ margin:0; padding:14px 16px; overflow:auto; flex:1; font-size:11.5px; line-height:1.55;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
            word-break:break-all; -webkit-user-select:text; user-select:text; color:var(--text) }
.sheet-foot{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border) }
.sheet-foot button{ font:inherit; font-size:12.5px; padding:6px 13px; border-radius:7px;
                    border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:default }
.sheet-foot button:hover{ background:var(--row-hover) }
.sheet-foot .primary{ background:var(--accent); border-color:transparent; color:#fff }
.sheet-foot .right{ margin-left:auto }
/* 同步挡板：比别的浮层再高一层 —— 这一刻确实不该让人改东西 */
#syncsheet{ z-index:80 }
.syncbox{ max-width:320px; width:auto; flex-direction:row; align-items:center;
          gap:12px; padding:18px 22px }
.syncbox b{ font-size:13.5px }
.syncbox .sub{ font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.45 }
.spinner{ flex:none; width:18px; height:18px; border-radius:50%;
          border:2px solid var(--border); border-top-color:var(--accent);
          animation:spin .7s linear infinite }
@keyframes spin{ to{ transform:rotate(360deg) } }
@media (prefers-reduced-motion:reduce){ .spinner{ animation-duration:2.4s } }
.titlebar{ position:fixed; top:0; left:0; right:0; height:34px; z-index:50;
           -webkit-app-region:drag; app-region:drag }
/* 可拖动区域里的可点击元素要单独排除，否则点不动 */
.titlebar *, .nav, button, input, select{ -webkit-app-region:no-drag; app-region:no-drag }
</style>
</head>
<body>
<div class="titlebar"></div>

<div class="welcome" id="welcome" hidden>
  <div class="welcome-box">
    <svg width="76" height="76" viewBox="0 0 16 16" aria-hidden="true" style="color:var(--accent)">
      <mask id="welcomeCut">
        <rect width="16" height="16" fill="#fff"/>
        <circle cx="8.7" cy="7.5" r=".95" fill="#000"/>
      </mask>
      <g fill="currentColor" mask="url(#welcomeCut)">
        <circle cx="11.5" cy="4.1" r="1.35"/>
        <rect x="2.3" y="8.1" width="5.2" height="3.7" rx="1.7"/>
        <rect x="5.5" y="4.3" width="8.2" height="7.6" rx="3.3"/>
      </g>
    </svg>
    <h2 id="welcometitle"></h2>
    <ul>
      <li><span class="ic">☁</span><span id="welcomesync"></span></li>
      <li><span class="ic">⌂</span><span id="welcomelocal"></span></li>
      <li><span class="ic">↩</span><span id="welcomeundo"></span></li>
    </ul>
    <button id="pick"></button>
    <p class="hint" id="welcomehint"></p>
    <p class="hint"><button class="logbtn" id="welcomelog" data-log></button>
       · <button class="logbtn" id="welcomelang" data-lang></button></p>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="19" height="19" viewBox="0 0 16 16" aria-hidden="true">
        <mask id="kapiCut">
          <rect width="16" height="16" fill="#fff"/>
          <circle cx="8.7" cy="7.5" r=".95" fill="#000"/>
        </mask>
        <g fill="currentColor" mask="url(#kapiCut)">
          <circle cx="11.5" cy="4.1" r="1.35"/>
          <rect x="2.3" y="8.1" width="5.2" height="3.7" rx="1.7"/>
          <rect x="5.5" y="4.3" width="8.2" height="7.6" rx="3.3"/>
        </g>
      </svg>
      <span id="brandname"></span>
    </div>
    <button class="vault" id="vault"></button>
    <input type="search" id="search" autocomplete="off">
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="logbtn" id="logbtn" data-log></button>
      <button class="logbtn" id="langbtn" data-lang></button>
    </div>
  </aside>
  <main class="main">
    <header>
      <div class="vhead">
        <div class="vheadtext">
          <h1 id="vtitle"></h1>
          <div class="sub" id="vsub"></div>
        </div>
        <!-- 只在垃圾桶且里面有东西时出现 -->
        <button class="ghost" id="purgeall" hidden></button>
      </div>
    </header>
    <div id="banner"></div>
    <div class="add" id="addbar">
      <input type="text" id="newTitle" autocomplete="off">
      <input type="date" id="newDate">
      <!-- 选项由 syncNewRepeat() 按所选日期生成（"每月第二个周二"离开日期就没法写死） -->
      <select id="newRepeat"></select>
      <!-- 选了"自定义天数…"才有内容 -->
      <span id="newcustom"></span>
    </div>
    <div class="list" id="list"></div>
  </main>

  <aside class="detailpane" id="detail">
    <div class="dhead">
      <input class="t" id="dtitle" autocomplete="off">
    </div>
    <div class="dmeta" id="dmeta"></div>
    <div class="dlabel" id="dlabel"></div>
    <div class="dbody" id="dbody"></div>
  </aside>
</div>
<div class="sheet" id="vaultsheet" hidden>
  <div class="sheet-box">
    <div class="sheet-head"><b id="vaultsheettitle"></b></div>
    <div class="vlist" id="vlist"></div>
    <div class="sheet-foot">
      <button class="primary" id="vaultadd"></button>
      <span class="note" id="vaultforgetnote"></span>
      <button class="right" id="vaultclose"></button>
    </div>
  </div>
</div>

<!-- 同步中的挡板：主进程读别的设备的改动时盖上，读完自动收 -->
<div class="sheet" id="syncsheet" hidden>
  <div class="sheet-box syncbox">
    <div class="spinner"></div>
    <div>
      <b id="synctitle"></b>
      <div class="sub" id="syncsub"></div>
    </div>
  </div>
</div>

<div class="sheet" id="logsheet" hidden>
  <div class="sheet-box">
    <div class="sheet-head">
      <b id="logsheettitle"></b>
      <span class="path" id="logpath"></span>
    </div>
    <pre id="logtext"></pre>
    <div class="sheet-foot">
      <button class="primary" id="logcopy"></button>
      <button id="logreveal"></button>
      <button class="right" id="logclose"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
